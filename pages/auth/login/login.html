<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogVerse — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.tailwindcss.com" />
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="text-white relative min-h-screen">
    <!-- Background layer -->
    <div
      class="fixed inset-0 -z-10 bg-[url('../../images/landingbg.jpg')] bg-cover bg-center bg-fixed"
    ></div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-b from-black/80 via-black/60 to-black/85"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 px-6 py-3">
      <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="text-2xl font-extrabold tracking-tight text-white">Blog<span class="text-indigo-400">Verse</span></a>
        <button class="block md:hidden text-white focus:outline-none" onclick="toggleMenu()">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="../../../index.html" class="text-white hover:text-indigo-300 transition">Home</a>
          <a href="../../Blogs/blogs.html" class="text-white hover:text-indigo-300 transition">Blog</a>
          <a href="#" class="text-white hover:text-indigo-300 transition">Contact</a>
        </div>
      </div>
      <div id="mobile-menu" class="md:hidden hidden text-center bg-white/10 backdrop-blur-xl border-b border-white/20 mt-3 py-2">
        <a href="../../../index.html" class="block text-white hover:text-indigo-300 px-4 py-2">Home</a>
        <a href="../../Blogs/blogs.html" class="block text-white hover:text-indigo-300 px-4 py-2">Blog</a>
        <a href="#" class="block text-white hover:text-indigo-300 px-4 py-2">Contact</a>
      </div>
    </nav>

    <!-- Login form -->
    <section class="flex items-center justify-center px-4 py-16">
      <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8">
        <h2 class="text-3xl font-bold mb-8 text-center">Welcome Back</h2>
        <div class="mb-5">
          <label for="email" class="block text-gray-200 font-semibold mb-2">Email</label>
          <input type="email" id="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" />
        </div>
        <div class="mb-7">
          <label for="password" class="block text-gray-200 font-semibold mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" />
        </div>
        <button type="button" onclick="login()" id="loginBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:from-indigo-500 hover:to-purple-500 transition duration-300 flex items-center justify-center">
          <span id="loginText">Login</span>
          <svg id="loginSpinner" class="hidden w-5 h-5 ml-2 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.964 7.964 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
        <p class="text-gray-300 mt-6 text-center">
          Don't have an account?
          <a href="../signup/signup.html" class="text-indigo-300 hover:underline">Sign up</a>
        </p>
      </div>
    </section>

    <script src="./login.js" type="module"></script>
  </body>
</html>
