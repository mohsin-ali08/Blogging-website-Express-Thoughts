<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogVerse — Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../css/output.css" />
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="text-white relative min-h-screen">
    <!-- Background layer -->
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center bg-fixed"
      style="background-image:url('../../images/backgrund.jpg')"
    ></div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-b from-black/85 via-black/70 to-black/90"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 px-5 py-3">
      <div class="mx-auto flex justify-between items-center">
        <a href="#" class="text-2xl font-extrabold tracking-tight text-white">Blog<span class="text-indigo-400">Verse</span></a>
        <button class="block md:hidden text-white focus:outline-none" onclick="toggleMenu()">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
        <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
          <a href="../../../index.html" class="text-white hover:text-indigo-300 transition">Home</a>
          <a href="../blogs.html" class="text-white hover:text-indigo-300 transition">Blog</a>
          <a href="../../contact/contact.html" class="text-white hover:text-indigo-300 transition">Contact</a>
          <a href="../../auth/login/login.html" id="LoginLink" class="text-white hover:text-indigo-300 transition">Login</a>
          <a href="../../auth/signup/signup.html" id="SignupLink" class="text-white hover:text-indigo-300 transition">Sign-up</a>
          <button onclick="logout()" id="logoutBtn" class="hidden bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg font-semibold hover:opacity-90 transition">Logout</button>
        </div>
      </div>
      <div id="mobile-menu" class="md:hidden hidden text-center bg-white/10 backdrop-blur-xl border-b border-white/20 mt-3 py-2">
        <a href="../../../index.html" class="block text-white hover:text-indigo-300 px-4 py-2">Home</a>
        <a href="../blogs.html" class="block text-white hover:text-indigo-300 px-4 py-2">Create Your Blog's</a>
        <a href="../../contact/contact.html" class="block text-white hover:text-indigo-300 px-4 py-2">Contact</a>
        <a href="../../auth/login/login.html" id="LoginLinkMob" class="block text-white hover:text-indigo-300 px-4 py-2">Login</a>
        <a href="../../auth/signup/signup.html" id="SignupLinkMob" class="block text-white hover:text-indigo-300 px-4 py-2">Sign-up</a>
        <button onclick="logout()" id="logoutBtnMob" class="hidden mx-auto mt-2 bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg font-semibold">Logout</button>
      </div>
    </nav>

    <!-- Blog content -->
    <section class="px-5 py-10">
      <div id="blogContainer" class="max-w-3xl mx-auto bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl"></div>
    </section>

    <!-- Comments -->
    <section class="my-10 px-4 md:px-8">
      <h2 class="text-2xl font-bold text-center mb-6 bg-white/10 backdrop-blur border border-white/20 rounded-xl shadow-lg p-4 max-w-3xl mx-auto text-white">User Thoughts</h2>
      <div id="commentsList" class="w-full max-w-3xl mx-auto px-4 py-6 rounded-xl border border-white/20 bg-white/5 backdrop-blur space-y-4"></div>
    </section>

    <!-- Comment form -->
    <div class="flex items-center justify-center px-4 pb-16">
      <div class="w-full max-w-2xl bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8">
        <h2 class="text-2xl font-bold mb-6 text-white">Leave a Comment</h2>
        <form id="commentForm">
          <div class="mb-4">
            <label for="name" class="block text-gray-200 font-medium mb-2">Name</label>
            <input type="text" id="name" required class="w-full p-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" placeholder="Your name" />
          </div>
          <div class="mb-4">
            <label for="email" class="block text-gray-200 font-medium mb-2">Email</label>
            <input type="email" id="email" required class="w-full p-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" placeholder="Your email" />
          </div>
          <div class="mb-4">
            <label for="comment" class="block text-gray-200 font-medium mb-2">Comment</label>
            <textarea id="comment" rows="4" required class="w-full p-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" placeholder="Your comment"></textarea>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:from-indigo-500 hover:to-purple-500 transition duration-300">Submit</button>
        </form>
      </div>
    </div>

    <!-- Edit modal -->
    <div id="editBlogModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/60 backdrop-blur-sm">
      <div class="w-full max-w-md p-6 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl relative">
        <div id="loader" class="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden rounded-2xl">
          <svg class="w-10 h-10 animate-spin text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.964 7.964 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <h2 class="mb-4 text-2xl font-bold text-white text-center">Edit Blog</h2>
        <form id="editBlogForm">
          <div class="mb-4">
            <label for="title" class="block mb-2 text-sm font-medium text-white">Title</label>
            <input type="text" id="title" required class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>
          <div class="mb-4">
            <label for="category" class="block mb-2 text-sm font-medium text-white">Category</label>
            <input type="text" id="category" required class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          </div>
          <div class="mb-4">
            <label for="content" class="block mb-2 text-sm font-medium text-white">Content</label>
            <textarea id="content" rows="4" required class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>
          <div class="flex justify-end">
            <button type="button" onclick="closeModal()" class="px-4 py-2 mr-2 text-gray-200 bg-white/10 rounded-lg hover:bg-white/20 transition">Cancel</button>
            <button type="submit" class="px-4 py-2 text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg hover:opacity-90 transition">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Notification -->
    <div id="blogNotification" class="fixed bottom-5 right-5 bg-indigo-900/80 backdrop-blur text-white px-5 py-3 rounded-lg shadow-lg opacity-0 invisible transition-all duration-300 z-50"></div>

    <footer class="bg-white/10 backdrop-blur-xl border-t border-white/20">
      <div class="container mx-auto flex flex-col md:flex-row justify-between items-center px-6 py-6 text-sm text-gray-300">
        <p>© 2024 BlogVerse. All rights reserved.</p>
        <div class="flex items-center space-x-4 mt-3 md:mt-0">
          <p>Developed by <span class="text-white font-semibold">_MOHSIN</span></p>
          <p>Karachi, Pakistan</p>
        </div>
      </div>
    </footer>

    <script src="./page.js" type="module"></script>
  </body>
</html>
