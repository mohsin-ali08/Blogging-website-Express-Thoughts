<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogVerse — My Blogs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/output.css" />
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="text-white relative min-h-screen">
    <!-- Background layer -->
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center bg-fixed"
      style="background-image:url('../images/backgrund.jpg')"
    ></div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-b from-black/80 via-black/60 to-black/85"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 px-6 py-3">
      <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="text-2xl font-extrabold tracking-tight text-white">Blog<span class="text-indigo-400">Verse</span></a>
        <button class="block md:hidden text-white focus:outline-none" onclick="toggleMenu()">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="../../index.html" class="text-white hover:text-indigo-300 transition">Home</a>
          <a href="../Blogs/blogs.html" class="text-white hover:text-indigo-300 transition">Blog</a>
          <a href="#" class="text-white hover:text-indigo-300 transition">Contact</a>
          <a href="../auth/login/login.html" id="LoginLink" class="text-white hover:text-indigo-300 transition">Login</a>
          <a href="../auth/signup/signup.html" id="SignupLink" class="text-white hover:text-indigo-300 transition">Sign-up</a>
          <button onclick="logout()" id="logoutBtn" class="hidden bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg font-semibold hover:opacity-90 transition">Logout</button>
        </div>
      </div>
      <div id="mobile-menu" class="md:hidden hidden text-center bg-white/10 backdrop-blur-xl border-b border-white/20 mt-3 py-2">
        <a href="../../index.html" class="block text-white hover:text-indigo-300 px-4 py-2">Home</a>
        <a href="../Blogs/blogs.html" class="block text-white hover:text-indigo-300 px-4 py-2">Blog</a>
        <a href="#" class="block text-white hover:text-indigo-300 px-4 py-2">Contact</a>
        <a href="../auth/login/login.html" id="LoginLinkMob" class="block text-white hover:text-indigo-300 px-4 py-2">Login</a>
        <a href="../auth/signup/signup.html" id="SignupLinkMob" class="block text-white hover:text-indigo-300 px-4 py-2">Sign-up</a>
        <button onclick="logout()" id="logoutBtnMob" class="hidden mx-auto mt-2 bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2 rounded-lg font-semibold">Logout</button>
      </div>
    </nav>

    <div class="container px-6 py-10">
      <h1 class="text-4xl font-extrabold text-center mb-10">Your Blogs</h1>

      <!-- Blog list -->
      <div id="blogLoader" class="flex justify-center items-center py-16">
        <svg class="w-10 h-10 animate-spin text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.964 7.964 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
      <div id="blogList" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16"></div>

      <!-- Create blog form -->
      <div class="flex justify-center">
        <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8">
          <h2 class="text-2xl font-bold mb-6 text-center">Write Your Own Blog</h2>
          <div id="blog-form">
            <div class="mb-4">
              <label for="title" class="block text-gray-200 font-semibold mb-2">Title</label>
              <input type="text" id="title" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" placeholder="An interesting title" />
            </div>
            <div class="mb-4">
              <label for="category" class="block text-gray-200 font-semibold mb-2">Category</label>
              <select id="category" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent">
                <option class="bg-gray-900">Select category</option>
                <option class="bg-gray-900">Health</option>
                <option class="bg-gray-900">Tech</option>
                <option class="bg-gray-900">Food</option>
                <option class="bg-gray-900">Dressing</option>
                <option class="bg-gray-900">AI</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="content" class="block text-gray-200 font-semibold mb-2">Content</label>
              <textarea id="content" rows="5" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" placeholder="Write your story..."></textarea>
            </div>
            <div class="mb-6">
              <label for="image" class="block text-gray-200 font-semibold mb-2">Image URL</label>
              <input type="url" id="image" placeholder="https://example.com/image.jpg" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" />
            </div>
            <button onclick="submitBlog()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:from-indigo-500 hover:to-purple-500 transition duration-300">Submit</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification -->
    <div id="blogNotification" class="fixed bottom-5 right-5 bg-indigo-900/80 backdrop-blur text-white px-5 py-3 rounded-lg shadow-lg opacity-0 invisible transition-all duration-300 z-50"></div>

    <script src="./blogs.js" type="module"></script>
  </body>
</html>
