<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      background: #000 !important;
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.45)),
        url(../../images/landingbg.jpg) !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
      min-height: 100vh;
    }
  </style>
  <body>
    <!-- Navbar -->
    <nav
      class="sticky top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/20 px-6 py-3"
    >
      <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="text-xl font-bold text-white">BlogVerse</a>
        <!-- Mobile Menu Button -->
        <button
          class="block md:hidden text-white focus:outline-none"
          onclick="toggleMenu()"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7"
            ></path>
          </svg>
        </button>
        <!-- Links -->
        <div class="hidden md:flex space-x-5">
          <a href="../../../index.html" class="text-gray-300 hover:text-white"
            >Home</a
          >
          <a href="../../Blogs/blogs.html" class="text-gray-300 hover:text-white"
            >Blog</a
          >
          <a href="#" class="text-gray-300 hover:text-white">Contact</a>
        </div>
      </div>
      <!-- Mobile Menu -->
      <div
        id="mobile-menu"
        class="md:hidden hidden text-center text-white bg-white/10 backdrop-blur-xl border-b border-white/20 transition-all duration-300 ease-in-out"
      >
        <a
          href="../../../index.html"
          class="block text-gray-300 hover:text-white px-4 py-2"
          >Home</a
        >
        <a
          href="../../Blogs/blogs.html"
          class="block text-gray-300 hover:text-white px-4 py-2"
          >Blog</a
        >
        <a
          href="#"
          class="block border-b text-gray-300 hover:text-white px-4 py-2"
          >Contact</a
        >
      </div>
    </nav>

    <!-- SignUp form -->
    <section class="flex items-center justify-center px-4 py-16">
      <div
        class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-8"
      >
        <h2 class="text-3xl font-bold mb-8 text-center text-white">Create Account</h2>
        <div class="mb-5">
          <label for="username" class="block text-gray-300 font-semibold mb-2"
            >Username</label
          >
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter Username"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
          />
        </div>
        <div class="mb-5">
          <label for="email" class="block text-gray-300 font-semibold mb-2"
            >Email</label
          >
          <input
            type="email"
            name="email"
            id="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
          />
        </div>
        <div class="mb-7">
          <label for="password" class="block text-gray-300 font-semibold mb-2"
            >Password</label
          >
          <input
            type="password"
            name="password"
            id="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
          />
        </div>
        <button
          type="button"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:from-indigo-500 hover:to-purple-500 focus:outline-none transition duration-300 flex items-center justify-center"
          onclick="signup()"
          id="signupBtn"
        >
          <span id="signupText">Sign Up</span>
          <svg id="signupSpinner" class="hidden w-5 h-5 ml-2 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.964 7.964 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
        <p class="text-gray-300 mt-6 text-center">
          Already have an account?
          <a href="../login/login.html" class="text-indigo-300 hover:underline"
            >Log In</a
          >
        </p>
      </div>
    </section>

    <script src="./signup.js" type="module"></script>
  </body>
</html>
